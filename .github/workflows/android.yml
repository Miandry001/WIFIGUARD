name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Standard pour la majorité des projets récents en Kotlin/Java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: wifiguard/android # Indique à Gradle où chercher les fichiers de configuration

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew
        working-directory: wifiguard/android

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: wifiguard/android

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifiguard-debug-apk
          path: wifiguard/android/app/build/outputs/apk/debug/app-debug.apk
